<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquidTracker Nha Trang</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #07111f;
            --bg-2: #0f172a;
            --panel: rgba(15, 23, 42, 0.9);
            --panel-strong: #111827;
            --card: rgba(30, 41, 59, 0.8);
            --card-alt: rgba(15, 23, 42, 0.8);
            --muted: #94a3b8;
            --text: #e2e8f0;
            --text-soft: #cbd5e1;
            --accent: #38bdf8;
            --accent-strong: #0284c7;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: rgba(148, 163, 184, 0.2);
            --shadow: 0 12px 28px rgba(2, 6, 23, 0.45);
            --radius: 18px;
        }

        html.light-mode {
            --bg: #f8fafc;
            --bg-2: #f1f5f9;
            --card: rgba(241, 245, 249, 0.95);
            --card-alt: rgba(248, 250, 252, 0.95);
            --muted: #64748b;
            --text: #1e293b;
            --text-soft: #334155;
            --accent: #0ea5e9;
            --accent-strong: #0284c7;
            --border: rgba(100, 116, 139, 0.2);
            --shadow: 0 12px 28px rgba(15, 23, 42, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 30%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            padding: 18px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .theme-toggle {
            appearance: none;
            border: 1px solid var(--border);
            background: rgba(30, 41, 59, 0.5);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .theme-toggle:hover {
            filter: brightness(1.15);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .card {
            background: linear-gradient(180deg, var(--card), var(--card-alt));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 1.2rem;
        }

        h2, h3 {
            margin: 0;
            color: var(--text);
        }

        .subtle {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, var(--accent), var(--accent-strong));
            color: #fff;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
            width: 100%;
            box-shadow: 0 8px 18px rgba(2, 132, 199, 0.25);
        }

        .btn:hover:not(:disabled) {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background: linear-gradient(180deg, #475569, #334155);
            cursor: not-allowed;
            opacity: 0.8;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(180deg, rgba(148, 163, 184, 0.18), rgba(51, 65, 85, 0.35));
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        html.light-mode .btn-secondary {
            background: linear-gradient(180deg, rgba(100, 116, 139, 0.12), rgba(148, 163, 184, 0.2));
        }

        .btn-danger {
            background: linear-gradient(180deg, #ef4444, #b91c1c);
            box-shadow: 0 8px 18px rgba(185, 28, 28, 0.2);
        }

        .btn-small {
            width: auto;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.98rem;
            border-radius: 10px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        html.light-mode input,
        html.light-mode select,
        html.light-mode textarea {
            background: rgba(248, 250, 252, 0.95);
            border-color: rgba(100, 116, 139, 0.3);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.9);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        input::placeholder, textarea::placeholder {
            color: rgba(148, 163, 184, 0.9);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row > .form-group {
            flex: 1;
            min-width: 0;
        }

        .filter-group {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }

        .filter-group .form-group {
            margin-bottom: 0;
            flex: 1;
        }

        .filter-group .btn {
            width: auto;
            padding: 10px 16px;
            align-self: flex-end;
        }

        .status-box {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border);
            color: var(--text-soft);
            font-size: 0.88rem;
            min-height: 42px;
            display: flex;
            align-items: center;
        }

        .status-box.success {
            border-color: rgba(52, 211, 153, 0.5);
            background: rgba(16, 185, 129, 0.08);
            color: #d1fae5;
        }

        .status-box.warning {
            border-color: rgba(251, 191, 36, 0.5);
            background: rgba(234, 179, 8, 0.08);
            color: #fef3c7;
        }

        .status-box.error {
            border-color: rgba(248, 113, 113, 0.5);
            background: rgba(239, 68, 68, 0.08);
            color: #fee2e2;
        }

        .photo-wrap {
            margin-top: 10px;
            border: 1px dashed rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
        }

        html.light-mode .photo-wrap {
            background: rgba(248, 250, 252, 0.7);
        }

        .photo-preview {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--border);
        }

        .inline-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .inline-actions .btn {
            flex: 1;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 10px 14px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        #map {
            height: 400px;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        .map-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .log-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .log-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .log-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .log-spot {
            font-weight: 700;
            color: var(--text);
        }

        .log-time {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .log-meta {
            color: var(--text-soft);
            font-size: 0.86rem;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .pill {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #bae6fd;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .log-photo {
            max-width: 100%;
            max-height: 180px;
            border-radius: 10px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        .empty-state {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0;
            padding: 8px 0 0;
        }

        @media (max-width: 640px) {
            body {
                padding: 14px;
            }

            .row,
            .filter-group,
            .inline-actions {
                flex-direction: column;
            }

            .filter-group .form-group {
                width: 100%;
            }

            .inline-actions .btn {
                width: 100%;
            }

            #map {
                height: 300px;
            }

            .map-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1 style="margin: 0; font-size: 1.5rem;">🐙 SquidTracker</h1>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="card">
        <div class="header-row">
            <div class="title-wrap">
                <div class="title-icon">📍</div>
                <div>
                    <h2>Геолокация и сессия</h2>
                    <div class="subtle">Снимайте точку лова и сохраняйте данные локально</div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <button class="btn" id="btn-location" type="button" onclick="getLocation()">Зафиксировать координаты</button>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="lat">Широта</label>
                <input type="text" id="lat" readonly placeholder="---">
            </div>
            <div class="form-group">
                <label for="lng">Долгота</label>
                <input type="text" id="lng" readonly placeholder="---">
            </div>
        </div>

        <div class="form-group">
            <label for="spot-name">Название локации / спота</label>
            <input type="text" id="spot-name" placeholder="Например: Скалы Ан Вьен">
        </div>

        <div id="location-status" class="status-box">Готово к фиксации локации.</div>
    </div>

    <div class="card">
        <div class="header-row">
            <div class="title-wrap">
                <div class="title-icon">🐙</div>
                <div>
                    <h2>Регистрация поклевки / улова</h2>
                </div>
            </div>
        </div>

        <form id="catch-form" onsubmit="saveCatch(event)">
            <div class="row">
                <div class="form-group">
                    <label for="egi-size">Размер EGI</label>
                    <select id="egi-size">
                        <option value="2.0">2.0</option>
                        <option value="2.5">2.5</option>
                        <option value="3.0" selected>3.0</option>
                        <option value="3.5">3.5</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="egi-type">Тип заглубления</label>
                    <select id="egi-type">
                        <option value="Shallow">Shallow</option>
                        <option value="Basic" selected>Basic</option>
                        <option value="Deep">Deep</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="egi-color">Цвет / Свечение</label>
                    <input type="text" id="egi-color" placeholder="Красный / Glow">
                </div>

                <div class="form-group">
                    <label for="depth-layer">Горизонт ловли</label>
                    <select id="depth-layer">
                        <option value="Поверхность">Поверхность</option>
                        <option value="Толща">Толща</option>
                        <option value="Дно" selected>Дно</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="mantle-length">Длина мантии (см)</label>
                    <input type="number" id="mantle-length" step="0.1" min="0" placeholder="15">
                </div>

                <div class="form-group">
                    <label for="squid-weight">Вес (г)</label>
                    <input type="number" id="squid-weight" step="1" min="0" placeholder="250">
                </div>
            </div>

            <div class="form-group">
                <label for="photo-input">Фотография улова</label>
                <input type="file" id="photo-input" accept="image/*" onchange="previewPhoto(event)">
                <div class="photo-wrap">
                    <img id="photo-img" class="photo-preview" alt="Превью фото улова">
                </div>
            </div>

            <button type="submit" class="btn">Сохранить запись</button>
            <div id="save-status" class="status-box">Запись будет сохранена в локальное хранилище.</div>
        </form>
    </div>

    <div class="card">
        <div class="header-row">
            <div class="title-wrap">
                <div class="title-icon">🧾</div>
                <div>
                    <h2>Журнал и аналитика</h2>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('logs')">📋 Логи</button>
            <button class="tab" onclick="switchTab('map')">🗺️ Карта</button>
            <button class="tab" onclick="switchTab('stats')">📊 Статистика</button>
        </div>

        <div id="logs" class="tab-content active">
            <div class="filter-group">
                <div class="form-group">
                    <label for="date-from">С</label>
                    <input type="date" id="date-from" onchange="applyDateFilter()">
                </div>
                <div class="form-group">
                    <label for="date-to">По</label>
                    <input type="date" id="date-to" onchange="applyDateFilter()">
                </div>
                <button class="btn btn-secondary btn-small" type="button" onclick="resetDateFilter()">Сброс</button>
            </div>

            <div id="logs-container">
                <p class="empty-state">Записи отсутствуют</p>
            </div>

            <div class="inline-actions">
                <button class="btn btn-secondary" type="button" onclick="exportLogs()">Экспорт JSON</button>
                <button class="btn btn-danger" type="button" onclick="clearLogs()">Очистить журнал</button>
            </div>
        </div>

        <div id="map" class="tab-content"></div>

        <div id="stats" class="tab-content">
            <div class="map-stats" id="stats-container"></div>
            <div id="stats-logs-container"></div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'squid_tracker_logs';
    let currentPhotoBase64 = null;
    let map = null;
    let markers = [];
    let allLogs = [];

    function initTheme() {
        const savedTheme = localStorage.getItem('theme-mode') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-mode');
            document.getElementById('theme-toggle').textContent = '☀️';
        }
    }

    function toggleTheme() {
        const isDark = !document.documentElement.classList.contains('light-mode');
        if (isDark) {
            document.documentElement.classList.add('light-mode');
            localStorage.setItem('theme-mode', 'light');
            document.getElementById('theme-toggle').textContent = '☀️';
        } else {
            document.documentElement.classList.remove('light-mode');
            localStorage.setItem('theme-mode', 'dark');
            document.getElementById('theme-toggle').textContent = '🌙';
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');

        if (tabName === 'map') {
            setTimeout(() => initMap(), 100);
        } else if (tabName === 'stats') {
            renderStats();
        }
    }

    function setStatus(elementId, message, type = '') {
        const el = document.getElementById(elementId);
        if (!el) return;
        el.className = 'status-box';
        if (type) {
            el.classList.add(type);
        }
        el.textContent = message;
    }

    function getLocation() {
        const btn = document.getElementById('btn-location');
        btn.disabled = true;
        btn.innerText = 'Получение координат...';
        setStatus('location-status', 'Запрашиваем координаты с устройства…', 'warning');

        if (!('geolocation' in navigator)) {
            setStatus('location-status', 'Геолокация не поддерживается этим браузером.', 'error');
            btn.disabled = false;
            btn.innerText = 'Зафиксировать координаты';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const latitude = position.coords.latitude.toFixed(6);
                const longitude = position.coords.longitude.toFixed(6);
                document.getElementById('lat').value = latitude;
                document.getElementById('lng').value = longitude;

                setStatus('location-status', `Координаты зафиксированы: ${latitude}, ${longitude}`, 'success');
                btn.disabled = false;
                btn.innerText = 'Координаты обновлены';
            },
            (error) => {
                setStatus('location-status', `Ошибка геолокации: ${error.message}`, 'error');
                btn.disabled = false;
                btn.innerText = 'Зафиксировать координаты';
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 30000
            }
        );
    }

    function previewPhoto(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
            currentPhotoBase64 = e.target.result;
            const img = document.getElementById('photo-img');
            img.src = currentPhotoBase64;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    function validateCatchData(catchData) {
        if (!catchData.spot || catchData.spot.trim() === '') {
            throw new Error('Укажите название спота или локации.');
        }

        if (!catchData.lat || catchData.lat === 'Н/Д' || !catchData.lng || catchData.lng === 'Н/Д') {
            throw new Error('Сначала зафиксируйте геолокацию.');
        }
    }

    function saveCatch(event) {
        event.preventDefault();

        const catchData = {
            id: Date.now(),
            timestamp: new Date().toLocaleString('ru-RU'),
            date: new Date().toISOString().split('T')[0],
            lat: document.getElementById('lat').value || 'Н/Д',
            lng: document.getElementById('lng').value || 'Н/Д',
            spot: (document.getElementById('spot-name').value || '').trim() || 'Без названия',
            egiSize: document.getElementById('egi-size').value,
            egiType: document.getElementById('egi-type').value,
            egiColor: document.getElementById('egi-color').value || 'Н/Д',
            depthLayer: document.getElementById('depth-layer').value,
            mantleLength: document.getElementById('mantle-length').value || '-',
            weight: document.getElementById('squid-weight').value || '-',
            photo: currentPhotoBase64
        };

        try {
            validateCatchData(catchData);
        } catch (error) {
            setStatus('save-status', error.message, 'error');
            return;
        }

        const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        logs.unshift(catchData);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));

        document.getElementById('catch-form').reset();
        const photoImg = document.getElementById('photo-img');
        photoImg.src = '';
        photoImg.style.display = 'none';
        currentPhotoBase64 = null;

        setStatus('save-status', 'Запись успешно сохранена локально.', 'success');
        renderLogs();
    }

    function getFilteredLogs() {
        const dateFromVal = document.getElementById('date-from').value;
        const dateToVal = document.getElementById('date-to').value;

        return allLogs.filter(item => {
            if (dateFromVal && item.date < dateFromVal) return false;
            if (dateToVal && item.date > dateToVal) return false;
            return true;
        });
    }

    function renderLogs() {
        allLogs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const filtered = getFilteredLogs();
        const container = document.getElementById('logs-container');

        if (!filtered.length) {
            container.innerHTML = '<p class="empty-state">Записи отсутствуют</p>';
            return;
        }

        container.innerHTML = filtered.map((item) => {
            const photoMarkup = item.photo ? `<img class="log-photo" src="${item.photo}" alt="Фото улова">` : '';
            return `
                <div class="log-item">
                    <div class="log-head">
                        <div class="log-spot">${escapeHtml(item.spot)}</div>
                        <span class="pill">${escapeHtml(item.egiSize)} / ${escapeHtml(item.egiType)}</span>
                    </div>
                    <div class="log-time">${escapeHtml(item.timestamp)}</div>
                    <div class="log-meta">
                        Координаты: ${escapeHtml(item.lat)}, ${escapeHtml(item.lng)}<br>
                        Цвет: ${escapeHtml(item.egiColor)} | Слой: ${escapeHtml(item.depthLayer)}<br>
                        Мантия: ${escapeHtml(item.mantleLength)} см | Вес: ${escapeHtml(item.weight)} г
                    </div>
                    ${photoMarkup}
                </div>
            `;
        }).join('');
    }

    function applyDateFilter() {
        renderLogs();
    }

    function resetDateFilter() {
        document.getElementById('date-from').value = '';
        document.getElementById('date-to').value = '';
        renderLogs();
    }

    function initMap() {
        if (map) return;

        const filtered = getFilteredLogs();
        if (!filtered.length) {
            const mapEl = document.getElementById('map');
            mapEl.innerHTML = '<p style="text-align: center; color: var(--muted); padding: 40px 20px;">Нет данных для отображения на карте</p>';
            return;
        }

        const mapEl = document.getElementById('map');
        mapEl.innerHTML = '';

        const centerLat = filtered.reduce((sum, log) => sum + parseFloat(log.lat), 0) / filtered.length;
        const centerLng = filtered.reduce((sum, log) => sum + parseFloat(log.lng), 0) / filtered.length;

        map = L.map(mapEl).setView([centerLat, centerLng], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        markers = [];
        filtered.forEach(log => {
            const marker = L.circleMarker([parseFloat(log.lat), parseFloat(log.lng)], {
                radius: 8,
                fillColor: '#38bdf8',
                color: '#0284c7',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map);

            marker.bindPopup(`
                <strong>${escapeHtml(log.spot)}</strong><br>
                ${escapeHtml(log.timestamp)}<br>
                EGI: ${escapeHtml(log.egiSize)} (${escapeHtml(log.egiType)})<br>
                Вес: ${escapeHtml(log.weight)} г
            `);

            markers.push(marker);
        });

        map.invalidateSize();
    }

    function renderStats() {
        const filtered = getFilteredLogs();
        const statsContainer = document.getElementById('stats-container');
        const statsLogsContainer = document.getElementById('stats-logs-container');

        if (!filtered.length) {
            statsContainer.innerHTML = '<p class="empty-state" style="grid-column: 1 / -1;">Нет данных для анализа</p>';
            statsLogsContainer.innerHTML = '';
            return;
        }

        const totalCatches = filtered.length;
        const totalWeight = filtered.reduce((sum, log) => sum + (parseFloat(log.weight) || 0), 0, 0);
        const avgWeight = totalWeight / totalCatches;

        const spotCounts = {};
        filtered.forEach(log => {
            spotCounts[log.spot] = (spotCounts[log.spot] || 0) + 1;
        });
        const bestSpot = Object.keys(spotCounts).reduce((a, b) => spotCounts[a] > spotCounts[b] ? a : b);

        statsContainer.innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${totalCatches}</div>
                <div class="stat-label">Всего уловов</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${totalWeight.toFixed(0)}г</div>
                <div class="stat-label">Общий вес</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${avgWeight.toFixed(0)}г</div>
                <div class="stat-label">Средний вес</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${bestSpot}</div>
                <div class="stat-label">Лучший спот</div>
            </div>
        `;

        statsLogsContainer.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 12px;">Детали по периоду</h3>' + filtered.map((item) => {
            const photoMarkup = item.photo ? `<img class="log-photo" src="${item.photo}" alt="Фото улова">` : '';
            return `
                <div class="log-item">
                    <div class="log-head">
                        <div class="log-spot">${escapeHtml(item.spot)}</div>
                        <span class="pill">${escapeHtml(item.egiSize)} / ${escapeHtml(item.egiType)}</span>
                    </div>
                    <div class="log-time">${escapeHtml(item.timestamp)}</div>
                    <div class="log-meta">
                        Координаты: ${escapeHtml(item.lat)}, ${escapeHtml(item.lng)}<br>
                        Цвет: ${escapeHtml(item.egiColor)} | Слой: ${escapeHtml(item.depthLayer)}<br>
                        Мантия: ${escapeHtml(item.mantleLength)} см | Вес: ${escapeHtml(item.weight)} г
                    </div>
                    ${photoMarkup}
                </div>
            `;
        }).join('');
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function exportLogs() {
        const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!logs.length) {
            setStatus('save-status', 'Нет данных для экспорта.', 'warning');
            return;
        }

        const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'squid-tracker-export.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        setStatus('save-status', 'Экспорт JSON завершён.', 'success');
    }

    function clearLogs() {
        const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!logs.length) {
            setStatus('save-status', 'Журнал уже пуст.', 'warning');
            return;
        }

        if (confirm('Удалить все сохраненные записи из локального хранилища?')) {
            localStorage.removeItem(STORAGE_KEY);
            map = null;
            renderLogs();
            setStatus('save-status', 'Журнал очищен.', 'success');
        }
    }

    window.onload = function () {
        initTheme();
        renderLogs();
        setStatus('save-status', 'Запись будет сохранена в локальное хранилище.', '');
    };
</script>
</body>
</html>
